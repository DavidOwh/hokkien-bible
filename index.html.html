<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闽南语圣经 Hokkien Bible</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --dark: #1a1208;
    --dark2: #2a1f0e;
    --dark3: #3a2d1a;
    --cream: #f5edd8;
    --cream2: #ede0c4;
    --text: #2c1f0a;
    --text-light: #6b5230;
    --red: #8b2020;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(139,32,32,0.06) 0%, transparent 50%);
  }

  header {
    text-align: center;
    padding: 40px 20px 30px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    position: relative;
  }

  header::before {
    content: '✦';
    display: block;
    color: var(--gold);
    font-size: 18px;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(24px, 5vw, 38px);
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 4px;
    text-shadow: 0 0 40px rgba(201,168,76,0.3);
  }

  header p {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    color: var(--gold);
    opacity: 0.5;
    font-size: 12px;
    letter-spacing: 8px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  /* Testament tabs */
  .testament-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 4px;
    border: 1px solid rgba(201,168,76,0.15);
  }

  .tab-btn {
    flex: 1;
    padding: 12px;
    background: none;
    border: none;
    color: var(--text-light);
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.3s;
    letter-spacing: 1px;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.1));
    color: var(--gold-light);
    border: 1px solid rgba(201,168,76,0.3);
  }

  .tab-btn:hover:not(.active) {
    background: rgba(255,255,255,0.04);
    color: var(--cream);
  }

  /* Books grid */
  .books-section { display: none; }
  .books-section.active { display: block; }

  .section-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.6;
    margin: 20px 0 10px;
  }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .book-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 8px;
    padding: 10px 8px;
    color: var(--cream2);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    line-height: 1.4;
  }

  .book-btn:hover {
    background: rgba(201,168,76,0.1);
    border-color: rgba(201,168,76,0.35);
    color: var(--gold-light);
    transform: translateY(-1px);
  }

  .book-btn.selected {
    background: linear-gradient(135deg, rgba(201,168,76,0.25), rgba(201,168,76,0.12));
    border-color: rgba(201,168,76,0.5);
    color: var(--gold-light);
  }

  /* Chapter selector */
  .chapter-panel {
    display: none;
    margin-top: 24px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 12px;
    padding: 20px;
  }

  .chapter-panel.visible { display: block; }

  .chapter-panel h3 {
    font-family: 'Noto Serif SC', serif;
    color: var(--gold-light);
    font-size: 16px;
    margin-bottom: 4px;
  }

  .chapter-panel p {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 6px;
  }

  .chapter-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 6px;
    padding: 10px 4px;
    color: var(--cream2);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .chapter-btn:hover {
    background: rgba(201,168,76,0.15);
    border-color: rgba(201,168,76,0.4);
    color: var(--gold-light);
  }

  .chapter-btn.playing {
    background: linear-gradient(135deg, rgba(201,168,76,0.3), rgba(201,168,76,0.15));
    border-color: var(--gold);
    color: var(--gold-light);
  }

  /* Player */
  .player-panel {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(26,18,8,0.95) 0%, rgba(26,18,8,1) 100%);
    border-top: 1px solid rgba(201,168,76,0.25);
    padding: 16px 20px;
    backdrop-filter: blur(20px);
    z-index: 100;
  }

  .player-panel.visible { display: block; }

  .player-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .player-info {
    flex: 1;
    min-width: 0;
  }

  .player-title {
    font-family: 'Noto Serif SC', serif;
    color: var(--gold-light);
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-sub {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 2px;
    letter-spacing: 1px;
  }

  audio {
    flex: 2;
    min-width: 200px;
    height: 36px;
    border-radius: 8px;
    accent-color: var(--gold);
  }

  audio::-webkit-media-controls-panel {
    background: rgba(201,168,76,0.1);
  }

  .close-player {
    background: none;
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 6px;
    color: var(--text-light);
    padding: 6px 10px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }

  .close-player:hover {
    border-color: rgba(201,168,76,0.5);
    color: var(--gold-light);
  }

  .player-note {
    width: 100%;
    font-size: 11px;
    color: rgba(201,168,76,0.4);
    text-align: center;
    letter-spacing: 1px;
  }

  /* Footer space for player */
  .footer-space { height: 100px; }

  .verse-banner {
    text-align: center;
    padding: 20px;
    margin-bottom: 8px;
  }

  .verse-banner blockquote {
    font-family: 'Noto Serif SC', serif;
    color: rgba(201,168,76,0.5);
    font-size: 13px;
    font-style: italic;
    letter-spacing: 1px;
    line-height: 1.8;
  }

  @media (max-width: 480px) {
    .books-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    .chapters-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
    .player-inner { gap: 10px; }
    audio { min-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>闽南语圣经</h1>
  <p>Hokkien Bible Audio</p>
  <div class="ornament">— ✦ —</div>
</header>

<div class="container">

  <div class="verse-banner">
    <blockquote>「你的话是我脚前的灯，是我路上的光。」诗篇 119:105</blockquote>
  </div>

  <div class="testament-tabs">
    <button class="tab-btn active" onclick="showTestament('ot')">旧约 Old Testament</button>
    <button class="tab-btn" onclick="showTestament('nt')">新约 New Testament</button>
  </div>

  <!-- OLD TESTAMENT -->
  <div class="books-section active" id="ot-section">
    <div class="section-label">律法书 Torah</div>
    <div class="books-grid" id="ot-law"></div>
    <div class="section-label">历史书 History</div>
    <div class="books-grid" id="ot-history"></div>
    <div class="section-label">诗歌书 Poetry</div>
    <div class="books-grid" id="ot-poetry"></div>
    <div class="section-label">先知书 Prophets</div>
    <div class="books-grid" id="ot-prophets"></div>
  </div>

  <!-- NEW TESTAMENT -->
  <div class="books-section" id="nt-section">
    <div class="section-label">四福音书 Gospels</div>
    <div class="books-grid" id="nt-gospels"></div>
    <div class="section-label">使徒行传 Acts</div>
    <div class="books-grid" id="nt-acts"></div>
    <div class="section-label">保罗书信 Paul's Letters</div>
    <div class="books-grid" id="nt-paul"></div>
    <div class="section-label">普通书信 General Letters</div>
    <div class="books-grid" id="nt-general"></div>
    <div class="section-label">启示录 Revelation</div>
    <div class="books-grid" id="nt-rev"></div>
  </div>

  <!-- Chapter panel -->
  <div class="chapter-panel" id="chapter-panel">
    <h3 id="cp-title"></h3>
    <p id="cp-sub">选择章节 · Select a chapter</p>
    <div class="chapters-grid" id="chapters-grid"></div>
  </div>

  <div class="footer-space"></div>
</div>

<!-- Player -->
<div class="player-panel" id="player-panel">
  <div class="player-inner">
    <div class="player-info">
      <div class="player-title" id="player-title">—</div>
      <div class="player-sub">闽南语圣经 · Hokkien Bible</div>
    </div>
    <audio id="audio-player" controls></audio>
    <button class="close-player" onclick="closePlayer()">✕</button>
    <div class="player-note">音频来自 Google Drive · Audio from Google Drive</div>
  </div>
</div>

};

let currentBook = null;
let currentBookNum = null;
let currentChapters = 0;

// Render all book grids
Object.entries(books).forEach(([gridId, bookList]) => {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  bookList.forEach(([name, num, chapters]) => {
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = name;
    btn.onclick = () => selectBook(name, num, chapters, btn);
    grid.appendChild(btn);
  });
});

function showTestament(t) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (t === 'ot' && i === 0) || (t === 'nt' && i === 1));
  });
  document.getElementById('ot-section').classList.toggle('active', t === 'ot');
  document.getElementById('nt-section').classList.toggle('active', t === 'nt');
  document.getElementById('chapter-panel').classList.remove('visible');
  document.querySelectorAll('.book-btn').forEach(b => b.classList.remove('selected'));
  currentBook = null;
}

function selectBook(name, num, chapters, btn) {
  document.querySelectorAll('.book-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  currentBook = name;
  currentBookNum = num;
  currentChapters = chapters;

  const panel = document.getElementById('chapter-panel');
  panel.classList.add('visible');
  document.getElementById('cp-title').textContent = name;
  document.getElementById('cp-sub').textContent = `共 ${chapters} 章 · ${chapters} Chapters`;

  const grid = document.getElementById('chapters-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= chapters; i++) {
    const ch = String(i).padStart(3, '0');
    const key = `${parseInt(num)}_${ch}`;
    const hasFile = !!fileIds[key];
    const btn2 = document.createElement('button');
    btn2.className = 'chapter-btn';
    btn2.textContent = i;
    btn2.title = hasFile ? `播放第${i}章` : '文件暂未加载';
    if (!hasFile) btn2.style.opacity = '0.4';
    btn2.onclick = () => playChapter(name, num, i, ch, btn2);
    grid.appendChild(btn2);
  }

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function playChapter(name, num, chNum, chPad, btn) {
  const key = `${parseInt(num)}_${chPad}`;
  const fileId = fileIds[key];

  document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');

  const player = document.getElementById('audio-player');
  const panel = document.getElementById('player-panel');
  const title = document.getElementById('player-title');

  title.textContent = `${name} 第${chNum}章`;

  if (fileId) {
    player.src = `https://drive.google.com/uc?export=open&id=${fileId}`;
    player.play().catch(() => {});
  } else {
    player.src = '';
    title.textContent = `${name} 第${chNum}章 · 请从 Google Drive 直接打开`;
  }

  panel.classList.add('visible');
}

function closePlayer() {
  const player = document.getElementById('audio-player');
  player.pause();
  player.src = '';
  document.getElementById('player-panel').classList.remove('visible');
  document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('playing'));
}
</script>
</body>
</html>
